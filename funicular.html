
<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>funicular</title>
<style>body{font-family:Arial,sans-serif;text-align:center;margin-top:50px}h1{color:darkblue}.custom-file-upload{display:inline-block;padding:10px 20px;cursor:pointer;
background-color:#4CAF50;color:#fff;border-radius:5px;transition:background-color .3s}.custom-file-upload:hover{background-color:#45a049}input[type=file]{display:none
}</style>
</head>
<body><h1>Maxim likes balls</h1><label for="fileInput" class="custom-file-upload">Choose File</label><input type="file" id="fileInput" accept=".html"><script  
>const fileInput=document.getElementById('fileInput');fileInput.addEventListener('change',e=>{const file=e.target.files[0];if(file&&file.type==='text/html'){const reader=new FileReader();
reader.onload=function(ev){const newTab=window.open();newTab.document.open();newTab.document.write(ev.target.result);newTab.document.close();fileInput.value='';};reader.readAsText(file)
;}else{alert('Please select a valid HTML file.');fileInput.value='';}});</script></body></html>
